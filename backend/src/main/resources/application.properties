# Server port
server.port=8080

# Database settings
spring.datasource.url=jdbc:mysql://localhost:3306/cookverse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Change this password to match your MySQL setup if necessary (e.g. root)
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Settings
# Must be a Base64-encoded string or a plaintext string of at least 256 bits (32 characters)
cookverse.jwt.secret=9a4f2c8d3e7b1a5f6c0d8e7b9a4f2c8d3e7b1a5f6c0d8e7b9a4f2c8d3e7b1a5f
# JWT expiration (24 hours in milliseconds)
cookverse.jwt.expiration=86400000

# File Upload Settings
# Local folder where recipe images are stored
file.upload.dir=./uploads

# Google Gemini API Settings
# Replace with your actual API key
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
